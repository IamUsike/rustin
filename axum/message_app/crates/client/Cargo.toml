[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
# Required for SinkExt and StreamExt traits
futures-util = "0.3"

# Required for JoinSet and async execution (enabling full features)
tokio = { version = "1.0", features = ["full"] }

# Required for WebSockets and Utf8Bytes types
tokio-tungstenite = "0.26"

axum = { version = "0.8.9", features = ["ws"] }
